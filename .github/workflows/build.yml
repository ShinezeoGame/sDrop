name: Construire sDrop

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publier:
        description: Publier cette compilation comme nouvelle version (Release)
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9
  VERSION: 1.0.${{ github.run_number }}

jobs:
  tests:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Analyse statique
        run: flutter analyze
      # Les tests font dialoguer deux appareils sDrop sur la machine : découverte, envoi,
      # refus, confiance, annulation.
      - name: Tests
        run: flutter test

  android:
    name: APK Android
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get

      # Facultatif : avec une clé personnelle, les mises à jour s'installent par-dessus
      # l'ancienne version sans avoir à désinstaller (voir README).
      - name: Clé de signature
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'sdrop' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Compilation de l'APK
        run: |
          flutter build apk --release --build-name=$VERSION --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk sdrop.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sdrop-android
          path: sdrop.apk
          retention-days: 30

  windows:
    name: Application Windows
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SORTIE: build\windows\x64\runner\Release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      # Les mêmes tests, sur Windows : c'est là que tourne l'application.
      - name: Tests
        run: flutter test
      - name: Compilation
        run: flutter build windows --release --build-name=${{ env.VERSION }} --build-number=${{ github.run_number }}

      - name: Assemblage
        shell: pwsh
        run: |
          # Bibliothèques d'exécution de Visual C++ : absentes d'un Windows fraîchement installé.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $env:SORTIE
          }
          Get-ChildItem $env:SORTIE | Format-Table Name, Length

      # L'application compilée se lance, ouvre sa fenêtre, se met à l'écoute du réseau et
      # répond à un autre appareil qui lui demande qui elle est.
      - name: Essai de démarrage
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$env:SORTIE\sdrop.exe" -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) { throw "sDrop s'est arrêté tout seul (code $($app.ExitCode))." }
          if ($app.MainWindowHandle -eq 0) { throw "sDrop n'a pas ouvert de fenêtre." }
          Write-Host "Fenêtre ouverte : « $($app.MainWindowTitle) »"

          $info = Invoke-RestMethod -Uri http://127.0.0.1:47873/info -TimeoutSec 10
          if ($info.sdrop -ne 1 -or -not $info.id -or -not $info.nom) { throw "Réponse inattendue : $($info | ConvertTo-Json -Compress)" }
          Write-Host "À l'écoute sous le nom « $($info.nom) » ($($info.type), port $($info.port))."

          $app.CloseMainWindow() | Out-Null
          if (-not $app.WaitForExit(20000)) { $app.Kill(); throw "sDrop ne se ferme pas." }
          Write-Host "Fermeture propre."

      - name: Archive portable
        shell: pwsh
        run: Compress-Archive -Path "$env:SORTIE\*" -DestinationPath sdrop-windows.zip

      - name: Installateur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" tools\installer\sdrop.iss
          if ($LASTEXITCODE -ne 0) { throw "La création de l'installateur a échoué." }
          Get-Item sdrop-setup.exe, sdrop-windows.zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: sdrop-windows
          path: |
            sdrop-setup.exe
            sdrop-windows.zip
          retention-days: 30

  # Une nouvelle version est publiée à chaque envoi sur « main », ou à la demande
  # (bouton « Run workflow », case « Publier »). Les liens …/releases/latest/download/…
  # du README pointent toujours vers la dernière.
  publication:
    name: Publication de la version
    needs: [android, windows]
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || inputs.publier)
    runs-on: ubuntu-latest
    permissions:
      contents: write # nécessaire pour publier la Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: sDrop ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            sdrop.apk
            sdrop-setup.exe
            sdrop-windows.zip
          body: |
            sDrop compilé automatiquement (commit ${{ github.sha }}).

            **Sur le téléphone** : téléchargez `sdrop.apk`, ouvrez-le et autorisez l'installation
            d'applications de sources inconnues si Android le demande.

            **Sur le PC** : téléchargez `sdrop-setup.exe` et lancez-le. L'application n'est pas
            signée : si Windows affiche « Windows a protégé votre ordinateur », cliquez sur
            « Informations complémentaires » puis « Exécuter quand même ». Au premier lancement,
            autorisez sDrop sur les réseaux privés quand le pare-feu le demande.

            `sdrop-windows.zip` est la version portable : décompressez-la et lancez `sdrop.exe`.
