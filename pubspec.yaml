name: sdrop
description: "sDrop — envoyer fichiers et textes entre le téléphone et le PC"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  shared_preferences: ^2.5.6
  file_picker: ^13.3.3
  # La version 0.9 exige un cross_file incompatible avec file_picker.
  desktop_drop: <0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit_300Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit_600SemiBold.ttf
          weight: 600
